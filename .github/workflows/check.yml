name: Checks

on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Logic tests
        run: node --test
      - name: No customer data in the repository
        run: python3 tools/check_no_customer_data.py
